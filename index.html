<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>フリック入力練習</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>フリック入力練習</h1>
        <p class="subtitle">スマホ向け：単語をフリック入力して30秒でハイスコアを目指そう</p>
      </header>

      <section class="status" aria-live="polite">
        <div><span class="label">お題</span><span id="targetWord" class="value target">あさ</span></div>
        <div><span class="label">入力中</span><span id="typed" class="value typed">_ _</span></div>
        <div><span class="label">スコア</span><span id="score" class="value">0</span></div>
        <div><span class="label">ハイスコア</span><span id="highScore" class="value">0</span></div>
        <div><span class="label">残り</span><span id="time" class="value">30</span></div>
      </section>

      <section class="keyboard-wrap">
        <div id="keyboard" class="keyboard" role="group" aria-label="フリックキーボード"></div>
      </section>

      <section class="controls">
        <button id="startBtn" type="button">スタート</button>
        <button id="resetBtn" type="button" class="secondary">リセット</button>
      </section>

      <p id="message" class="message">「スタート」を押して開始！</p>
    </main>

    <template id="key-template">
      <button class="key" type="button">
        <span class="center"></span>
        <span class="hint up"></span>
        <span class="hint right"></span>
        <span class="hint down"></span>
        <span class="hint left"></span>
      </button>
    </template>

    <script src="script.js"></script>
  </body>
</html>
